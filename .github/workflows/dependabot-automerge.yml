name: Dependabot patch auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions: {}
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Re-evaluate every revision, including a group that gains a minor update.
      - name: Clear previously enabled auto-merge
        run: |
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" = true ]; then gh pr merge --disable-auto "$PR_URL"; fi
      # Never check out or execute PR code in this privileged workflow.
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge for patch-only updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        # GitHub waits for required checks and an up-to-date branch; no bypass.
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
