name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate stable release from main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/validate.mjs "$RELEASE_TAG"

  check:
    needs: validate
    uses: ./.github/workflows/check.yml

  publish:
    needs: [validate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Prepare image names and refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then
            echo 'This release already exists; publish a new version instead.' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          {
            echo "RELEASE_VERSION=$version"
            echo "CENTRAL_IMAGE=$DOCKERHUB_USERNAME/baboreborn-central:$version"
            echo "SERVER_IMAGE=$DOCKERHUB_USERNAME/baboreborn-server:$version"
          } >> "$GITHUB_ENV"
      - name: Enable the multiarch image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Keep both architectures local so publication reuses the tested images.
      - name: Build multiarch images and test the native platform
        env:
          DOCKER_BUILD_FLAGS: --platform=linux/amd64,linux/arm64
        run: make test-docker
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested images, verify platforms and record index digests
        run: |
          echo "Source: $GITHUB_SHA" > "$RUNNER_TEMP/images.txt"
          for image in "$CENTRAL_IMAGE" "$SERVER_IMAGE"; do
            docker push "$image"
            manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
            jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture]
              | sort == ["amd64", "arm64"]
            ' <<< "$manifest"
            digest="$(jq -er '.digest' <<< "$manifest")"
            echo "${image%:*}@$digest" >> "$RUNNER_TEMP/images.txt"
          done
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/images.txt" \
            --verify-tag --title "BaboReborn $RELEASE_TAG" \
            --generate-notes
