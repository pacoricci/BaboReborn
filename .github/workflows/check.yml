name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  # Release publication reuses this gate instead of duplicating it.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the production image (deploy/docker/compose.yaml).
      POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/checks/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install PostgreSQL 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17
      - run: make dependencies
      - run: make check-ci

  browser:
    name: browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      POSTGRES_BIN: /usr/lib/postgresql/17/bin
      BABOREBORN_SOFTWARE_GL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install PostgreSQL 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17
      # Browser jobs need build dependencies, but no lint or vulnerability tools.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install software WebGL
        run: sudo apt-get install -y --no-install-recommends libegl-mesa0 libgl1-mesa-dri xvfb xauth
      # Shard individual tests (including product.spec.mjs); keep one worker per runner.
      - run: xvfb-run -a make test-browser BROWSER_ARGS='--fully-parallel --shard=${{ matrix.shard }}/3'
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the required check name and reject failed, cancelled or skipped jobs.
  check:
    needs: [quality, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality and browser checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
