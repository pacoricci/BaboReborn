<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floor decals · BaboReborn</title>
    <style>
      body {
        margin: 24px;
        background: #172127;
        color: #edf2ee;
        font:
          14px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: auto;
      }
      h1 {
        font-size: 20px;
      }
      a {
        color: #99d8d0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #111;
      }
      button,
      select {
        font: inherit;
      }
      output {
        font-variant-numeric: tabular-nums;
      }
      :focus-visible {
        outline: 2px solid #99d8d0;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="./">Development tools</a>
      <h1>Floor decals</h1>
      <p>Game camera, authored map and reference actors. Static preview; no combat simulation.</p>
      <div class="controls">
        <label
          >Map
          <select id="arena" aria-label="Map"></select
        ></label>
        <label><input id="enabled" type="checkbox" checked /> Decals</label>
        <label>Strength <input id="strength" type="range" min="0" max="100" value="75" /></label>
        <label
          >Quality
          <select id="quality">
            <option>high</option>
            <option>medium</option>
            <option>low</option>
          </select></label
        >
        <button id="north" type="button">North</button>
        <button id="center" type="button">Center</button>
        <button id="south" type="button">South</button>
        <button id="blood" type="button">Blood overlap</button>
        <button id="clear" type="button">Clear blood</button>
      </div>
      <canvas id="preview" aria-label="Floor decal preview"></canvas>
      <p id="status" role="status">Loading…</p>
      <output id="metrics"></output>
    </main>
    <script type="module" src="./decals.ts"></script>
  </body>
</html>
