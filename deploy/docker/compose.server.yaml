services:
  server:
    image: ${SERVER_IMAGE:-baboreborn/server:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: server
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    command:
      - -data-dir
      - /data
      - -addr
      - :8443
      - -central
      - ${CENTRAL_ORIGIN:?Set CENTRAL_ORIGIN}
      - -tls-cert
      - /run/config/fullchain.pem
      - -tls-key
      - /run/config/privkey.pem
      - -pairing-code-file
      - ${PAIRING_CODE_FILE:-}
    ports:
      - ${SERVER_BIND:-0.0.0.0}:${SERVER_PORT:-8443}:8443
    volumes:
      - server-data:/data
      - type: bind
        source: ${SERVER_CONFIG_DIR:-./secrets/server}
        target: /run/config
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Local liveness only. Public registration separately verifies TLS and WSS.
      test:
        [CMD, curl, --fail, --silent, --insecure, --max-time, '3', 'https://127.0.0.1:8443/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  server-data:
